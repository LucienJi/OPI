# @package _global_
defaults:
  - /base_configs/OPI_dmc
  - /oracles/dmc/cartpole_swingup_sparse
  - _self_
method_name: "OPI_Cartpole"

seed: 42

env:
  domain_name: "cartpole"
  task_name: "swingup_sparse"
  render_size: [128,128]
  n_sub_steps: 1
  seed: ${seed}

obs_config:
  position: [3]
  velocity: [2]

run_name: ${method_name}_${env.domain_name}_${env.task_name}_seed${seed}
training:
  reuse_action: false
  baseline_greedy_guided: true
  n_oracles: 3

  save_video_every: 100000
  use_wandb: true
  use_compile: true
  save_video: true
  wandb_project_name: DMC
