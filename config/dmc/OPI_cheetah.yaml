# @package _global_
defaults:
  - /base_configs/OPI_dmc
  - /oracles/dmc/cheetah_run
  - _self_
method_name: "OPI_cheetah"
seed: 42

env:
  domain_name: "cheetah"
  task_name: "run"

obs_config:
  position: [8]
  velocity: [9]

input_mapping:
  robot_states: ["velocity", "position"]

run_name: ${method_name}_${env.domain_name}_${env.task_name}_seed${seed}
training:
  reuse_action: false
  baseline_greedy_guided: true
  n_oracles: 3

  save_video_every: 100000
  use_wandb: true
  use_compile: true
  save_video: true
  wandb_project_name: DMC
