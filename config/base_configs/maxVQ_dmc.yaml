# @package _global_
defaults:
  - /paths
  - /oracles/simba_based_oracle_args
  - /oracles/mlp_based_oracle_args

seed: 42
save_video_fps: 30

env:
  render_size: [128, 128]
  n_sub_steps: 1
  seed: ${seed}

training:
  run_name: ${run_name}
  checkpoint_dir: ./checkpoints/${run_name}
  seed: ${seed}
  total_timesteps: 1000000
  replay_dir: ./checkpoints/${run_name}/replay_buffer
  capacity: 1000000
  nstep: 1
  discount: 0.99
  tau: 0.005
  save_episodes_to_disk: true

  selection_mode: "max_v"
  oracle_burnin_steps: 20000

  learner_learning_starts: 20000
  policy_delay: 2
  learner_critic_utd_ratio: 2
  learner_critic_batch_size: 1024
  replay_ratio: 0.9

  normalize_observations: true
  normalize_rewards: true
  normalized_g_max: 5.0

  min_exploration_noise: 0.01
  max_exploration_noise: 0.2
  clip_noise: 0.3
  noise_clip: 0.3

  oracle_std_multiplier: [0.2, 0.2, 0.2]

  action_selection_buffer_size: 10000

  actor_lr: 3e-4
  critic_lr: 3e-4
  actor_weight_decay: 1e-4
  critic_weight_decay: 1e-4
  value_weight_decay: 1e-4
  max_grad_norm: 1.0
  policy_max_grad_norm: 1.0
  target_policy_noise: 0.1
  task_specific_noise: 0.1

  eval_every: 5000
  eval_episodes: 5
  save_freq: 5000
  save_video: true
  save_video_every: 100000
  save_video_fps: ${save_video_fps}
  resume: true
  use_wandb: true
  wandb_project_name: DMC
  wandb_entity: ${oc.env:WANDB_ENTITY,null}
  wandb_group: ${method_name}
  log_every: 10
  keep_checkpoint_num: 5

  use_compile: true
  dynamo_cache_size_limit: 64

  num_bins: 101
  min_v: -5.0
  max_v: 5.0

rl_agent_args:
  hidden_dim: 256
  num_blocks: 2
  scaler_init: 0.3
  scaler_scale: 1.0
  alpha_init: 0.3
  alpha_scale: 1.0
  c_shift: 4.0
  noise_clip: ${training.clip_noise}

oracle_critic_args:
  hidden_dim: 256
  num_blocks: 2
  scaler_init: 0.3
  scaler_scale: 1.0
  alpha_init: 0.3
  alpha_scale: 1.0
  c_shift: 4.0
  num_bins: 101
  min_v: -5.0
  max_v: 5.0
  num_qs: 2
