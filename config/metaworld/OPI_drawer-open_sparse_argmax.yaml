# @package _global_
defaults:
  - /base_configs/OPI_metaworld
  - /oracles/metaworld/drawer-open
  - _self_

method_name: "OPI_DrawerOpen_Sparse_argmax"

seed: 42

env:
  env_name: "drawer-open-v3"
  camera_to_render: "corner4"
  seed: ${seed}
  sparse_reward: true

run_name: ${method_name}_${env.env_name}_seed${seed}

training:
  reuse_action: true
  n_oracles: 2

  total_timesteps: 500000
  capacity: 500000

  sampling_max_temperature: 1.0e-5
  sampling_min_temperature: 1.0e-5

  save_video: false

  wandb_tags: ["ablation", "mw_sparse", "argmax"]
